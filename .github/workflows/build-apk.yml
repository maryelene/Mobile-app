name: Build EduFlow Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate Android project directory
        id: find-project
        run: |
          PROJECT_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found in repository."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found Android project at: $PROJECT_DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Prepare keystore, config, and fallback Firebase strings
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          touch local.properties secrets.properties

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            mkdir -p app/src/main/res/values
            cat << 'EOF' > app/src/main/res/values/ci_firebase_fallback.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_web_client_id" translatable="false">placeholder-client-id.apps.googleusercontent.com</string>
          </resources>
          EOF
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: EduFlow-Notes-Debug-APK
          path: ${{ steps.find-project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
